[project]
name = "moxygen"
version = "0.1.0"
description = "MCP server that exposes Doxygen XML documentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
moxygen = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = ["extractors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
